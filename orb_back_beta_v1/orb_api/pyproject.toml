[project]
name = "orb-api"
version = "0.2.0"
description = "API do Orb - Assistente filosófico com IA e astrologia"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Aline Alves Silva", email = "aline@orb.com"}
]
license = {text = "MIT"}
dependencies = [
    # Web Framework
    "fastapi",
    "uvicorn",
    "python-dotenv",
    
    # HTTP Client
    "httpx",
    
    # Data Validation
    "pydantic",
    "pydantic-settings",
    
    # Astrology Engine (ASTRA_API)
    "kerykeion>=5.12.9",
    
    # AI Models
    "google-generativeai",
    "freeflow-llm",
    
    # Audio Processing (Speech-to-Speech)
    "pydub",
    "python-multipart",
]

[dependency-groups]
dev = [
    "black",
    "pytest",
    "pytest-cov",
    "mypy",
    "types-requests",
    "httpx",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.poe.tasks]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8001"
dev-astra = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
test = "pytest -v"
format = "black . --line-length 100"
quality = "mypy --ignore-missing-imports ."

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-v", "--tb=short"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]